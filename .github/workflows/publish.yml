name: Publish to GHCR and Docker Hub

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release and image name
        id: release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const versionFiles = ['server/app.ts', 'src/utils/versionService.ts'];
          const versionPattern = /\b(?:export\s+)?const\s+CURRENT_APP_VERSION\s*=\s*['"]([^'"]+)['"]\s*;/;
          const sourceVersionsMatch = versionFiles.every((file) =>
            readFileSync(file, 'utf8').match(versionPattern)?.[1] === version
          );
          if (
            process.env.GITHUB_REF_NAME !== `v${version}` ||
            lock.version !== version ||
            lock.packages[''].version !== version ||
            !sourceVersionsMatch
          ) {
            throw new Error('Release tag, package manifests, and application versions must match.');
          }
          NODE
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.release.outputs.image }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rehearsalhq
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push RehearsalHQ
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
